<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unique name generator | uniqus.name</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <p class="credit">
      made with <span aria-label="love" role="img">💗</span>
      <a href="https://devium.me/" target="_blank" rel="noopener">Vano Devium</a>
    </p>
    <main>
      <button id="unique-name" type="button" aria-label="Copy name">
        <span id="name-words"></span>
      </button>
      <p id="status" role="status">Click the name to copy it</p>
    </main>
    <form class="controls" onsubmit="return false">
      <label>
        Words
        <select name="words-count" id="words-count">
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>
      <label>
        Separator
        <select name="words-separator" id="words-separator">
          <option value="-">-</option>
          <option value="_">_</option>
          <option value=":">:</option>
          <option value=".">.</option>
          <option value="/">/</option>
        </select>
      </label>
      <label>
        Style
        <select name="words-style" id="words-style">
          <option value="lowerCase">lowercase</option>
          <option value="upperCase">UPPERCASE</option>
          <option value="capital">Capital</option>
        </select>
      </label>
      <button id="generate" type="button">Generate</button>
    </form>
    <script type="module" src="/app.js"></script>
  </body>
</html>
